name: test

on:
  push:
  pull_request:

jobs:
  cdc:
    name: 33 CFR 160.202
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:cdc
      - run: npm run typecheck
